name: Build and Push Docker Images
on:
  push:
    branches: [ branchHTTPserver ]
jobs:
  build_project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool
      
      - name: Generate configure script
        run: autoreconf -fi
      
      - name: Run configure
        run: ./configure
      
      - name: Run make
        run: make
      
      - name: Prepare Docker build context
        run: |
          mkdir -p warlock-host
          cp series warlock-host/
          cp start-server.sh warlock-host/
      
      - name: Upload warlock-host folder
        uses: actions/upload-artifact@v4
        with:
          name: warlock-host
          path: warlock-host/
          
  build_and_push:
    needs: [build_project]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download warlock-host folder
        uses: actions/download-artifact@v4
        with:
          name: warlock-host
          path: warlock-host
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push multi-architecture image
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest \
            ./warlock-host
