name: Build and Push Multi-Architecture Docker Images
on:
  push:
    branches: [ branchHTTPserver ]

jobs:
  build_project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool
      
      - name: Generate configure script
        run: autoreconf -fi
      
      - name: Run configure
        run: ./configure
      
      - name: Run make
        run: make
      
      - name: Prepare Docker build context
        run: |
          mkdir -p warlock-host
          cp series warlock-host/
          cp start-server.sh warlock-host/
          cp Dockerfile warlock-host/
      
      - name: Upload warlock-host folder
        uses: actions/upload-artifact@v4
        with:
          name: warlock-host
          path: warlock-host/
  
  build_and_push:
    needs: build_project
    runs-on: ubuntu-latest
    steps:
      - name: Download warlock-host folder
        uses: actions/download-artifact@v4
        with:
          name: warlock-host
          path: warlock-host
      
      - name: QEMU Install
        uses: docker/setup-qemu-action@v3
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build AMD64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/series:amd64 \
            ./warlock-host
    
      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ secrets.DOCKER_USERNAME }}/series:arm64 \
            ./warlock-host
      
      - name: Create manifest
        run: |
          docker manifest create ${{ secrets.DOCKER_USERNAME }}/series:latest \
            --amend ${{ secrets.DOCKER_USERNAME }}/series:amd64 \
            --amend ${{ secrets.DOCKER_USERNAME }}/series:arm64
      
      - name: Push manifest to Docker Hub
        run: |
          docker manifest push ${{ secrets.DOCKER_USERNAME }}/series:latest
