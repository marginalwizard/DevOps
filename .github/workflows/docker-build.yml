name: Build and Push Docker Images
on:
  push:
    branches: [ branchHTTPserver ]
jobs:
  build_project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool
      
      - name: Generate configure script
        run: autoreconf -fi
      
      - name: Run configure
        run: ./configure
      
      - name: Run make
        run: make
      
      - name: Prepare Docker build context
        run: |
          mkdir -p warlock-host
          cp series warlock-host/
          cp start-server.sh warlock-host/
      
      - name: Upload warlock-host folder
        uses: actions/upload-artifact@v4
        with:
          name: warlock-host
          path: warlock-host/
          
  qemu_install:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU
        uses: docker/setup-qemu-action@v3
        
  build_and_push:
    needs: [build_project, qemu_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download warlock-host folder
        uses: actions/download-artifact@v4
        with:
          name: warlock-host
          path: warlock-host
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push for AMD64
        uses: docker/build-push-action@v5
        with:
          context: ./warlock-host
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/warlock-server:amd64-${{ steps.timestamp.outputs.timestamp }}
          
      - name: Build and push for ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./warlock-host
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/warlock-server:arm64-${{ steps.timestamp.outputs.timestamp }}
          
      - name: Create and push manifest
        run: |
          docker manifest create ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest \
            ${{ secrets.DOCKER_USERNAME }}/warlock-server:amd64-${{ steps.timestamp.outputs.timestamp }} \
            ${{ secrets.DOCKER_USERNAME }}/warlock-server:arm64-${{ steps.timestamp.outputs.timestamp }}
          docker manifest push ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest
