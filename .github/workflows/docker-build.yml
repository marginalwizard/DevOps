name: Build and Push Multi-Architecture Docker Images
on:
  push:
    branches: [ branchHTTPservMulti ]
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push AMD64 image
        run: |
          docker buildx build --platform=linux/amd64 \
          -t ${{ secrets.DOCKER_USERNAME }}/warlock-server:amd64-new \
          --push ./warlock-host

      - name: Build and Push ARM64 image
        run: |
          docker buildx build --platform=linux/arm64 \
          -t ${{ secrets.DOCKER_USERNAME }}/warlock-server:arm64-new \
          --push ./warlock-host

      - name: Create manifest
        run: |
          docker manifest create ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest \
          ${{ secrets.DOCKER_USERNAME }}/warlock-server:amd64-new \
          ${{ secrets.DOCKER_USERNAME }}/warlock-server:arm64-new
      
      - name: Push manifest to Docker Hub
        run: |
          docker manifest push ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest
      
      - name: Test server functionality
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest
          
          docker run -d --name test-server -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest
          
          sleep 5
          
          curl -s http://localhost:8081/compute || echo "Server test failed, but continuing workflow"
          
          docker stop test-server
          docker rm test-server
