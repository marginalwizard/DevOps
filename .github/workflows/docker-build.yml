name: Build and Push Docker Images

on:
  push:
    branches: [ branchHTTPserver ]

jobs:
  make_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Run configure
        run: ./configure
      
      - name: Run make check
        run: make check
      
      - name: Run distcheck
        run: make distcheck

  qemu_install:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU
        uses: docker/setup-qemu-action@v1

  build_and_push:
    needs: [make_check, qemu_install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push for AMD64
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/warlock-server:amd64

      - name: Build and push for ARM64
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/warlock-server:arm64

      - name: Create and push manifest
        run: |
          docker manifest create ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest \
            ${{ secrets.DOCKER_USERNAME }}/warlock-server:amd64 \
            ${{ secrets.DOCKER_USERNAME }}/warlock-server:arm64
          docker manifest push ${{ secrets.DOCKER_USERNAME }}/warlock-server:latest
